<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trainspotting</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body { margin:0; height:100%; font-family:Arial; background:#111; color:white; }

header {
  padding:10px;
  background:#151515;
  display:flex;
  gap:10px;
  align-items:center;
}

#map { height: calc(100% - 50px); }

button {
  background:#222;
  color:white;
  border:1px solid #444;
  padding:6px 10px;
  cursor:pointer;
}

.active {
  background:#444;
}

.red { color:red; }
.purple { color:violet; }
</style>
</head>

<body>

<header>
  <b>Trainspotting</b>

  <button onclick="setFilter('all')" id="btnAll" class="active">Kaikki</button>
  <button onclick="setFilter('stopped')" id="btnStop">Pysähtyneet</button>
  <button onclick="setFilter('night')" id="btnNight">Yöseisonta</button>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([64.5, 26], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

let filter = "all";

const trains = [
  {id:"CARGO-101", lat:60.17, lon:24.94, speed:0, stop:120},
  {id:"CARGO-202", lat:61.50, lon:23.76, speed:60, stop:0},
  {id:"CARGO-303", lat:65.01, lon:25.47, speed:0, stop:8}
];

function isNight(stop){
  return stop > 60;
}

function render(){

  map.eachLayer(l => {
    if(l instanceof L.CircleMarker) map.removeLayer(l);
  });

  trains.forEach(t => {

    let stopped = t.speed === 0;
    let night = isNight(t.stop);

    if(filter === "stopped" && !stopped) return;
    if(filter === "night" && !night) return;

    let color = stopped ? "red" : "limegreen";

    let label = "";
    if(night) label = "🌙 Yöseisonta";
    else if(stopped) label = "⏸ Pysähtynyt";
    else label = "🚆 Liikkuu";

    L.circleMarker([t.lat,t.lon],{
      radius:8,
      color:color,
      fillColor:color,
      fillOpacity:0.8
    })
    .bindPopup(`
      <b>${t.id}</b><br>
      Tila: ${label}<br>
      Nopeus: ${t.speed} km/h<br>
      Pysähdys: ${t.stop} min
    `)
    .addTo(map);
  });
}

function setFilter(f){
  filter = f;

  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));

  if(f==="all") document.getElementById("btnAll").classList.add("active");
  if(f==="stopped") document.getElementById("btnStop").classList.add("active");
  if(f==="night") document.getElementById("btnNight").classList.add("active");

  render();
}

render();
</script>

</body>
</html>
